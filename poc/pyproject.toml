[project]
name = "askolake-poc"
version = "0.1.0"
description = "Validation POCs for the Ask OLake hackathon plan (measurements, not a product)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tiktoken>=0.8",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "fastembed>=0.5",
    "numpy>=1.26",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ingest", "chunking", "retrieval", "answer", "eval", "api", "freshness"]
