<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ask OLake</title>
<link rel="stylesheet" href="/static/embed.css">
<script type="module" src="/static/embed.js"></script>
</head>
<body>
<div class="app" role="dialog" aria-modal="true" aria-labelledby="title">
  <header class="bar">
    <h1 id="title" class="title">Ask OLake</h1>
    <button type="button" class="icon-btn" id="close" aria-label="Close Ask OLake">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <div class="log" id="log" role="log" aria-live="polite" aria-busy="false" aria-label="Conversation">
    <section class="welcome" id="welcome">
      <p class="lead">Answers come from the OLake docs and GitHub repos. Every claim links to the page it came from.</p>
      <ul class="chips" aria-label="Example questions">
        <li><button type="button" class="chip">Which databases can OLake replicate from?</button></li>
        <li><button type="button" class="chip">How does OLake write data into Apache Iceberg?</button></li>
        <li><button type="button" class="chip">Can I get an alert when a sync job fails?</button></li>
      </ul>
    </section>
  </div>

  <form class="composer" id="composer">
    <label class="sr-only" for="q">Your question about OLake</label>
    <textarea id="q" rows="1" maxlength="2000" enterkeyhint="send"
              placeholder="Ask about setup, sources, catalogs or Fusion"></textarea>
    <button type="submit" class="send" id="send" aria-label="Send question">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="foot" id="foot"></p>
</div>
</body>
</html>
