# Non-secret runtime settings (contract I4) for both hosts. deploy/deploy.sh adds a fresh CANARY and GIT_SHA on
# every deploy (into the gitignored deploy/*.deploy.yaml copies). Keys never go here: LLM_*_API_KEY and
# GITHUB_TOKEN come from Secret Manager (Cloud Run) or SECRET envs (DigitalOcean).
# Edit this file for the tuning. The provider settings below are only fallbacks: deploy.sh takes each provider's
# BASE_URL, MODEL and REASONING_EFFORT from the shell (.env, loaded with set -a; source .env; set +a) when set there.
# LLM chain, tried in order: your main provider, the paid fallback (>= 100 RPM), Gemma on the Gemini free tier.
LLM_BASE_URL: ""
LLM_MODEL: ""
LLM_REASONING_EFFORT: ""
LLM_FALLBACK_BASE_URL: ""
LLM_FALLBACK_MODEL: ""
# Each provider has its own reasoning setting (LLM_REASONING_EFFORT is the primary's only), e.g. "low" for gpt-oss
LLM_FALLBACK_REASONING_EFFORT: ""
# Pre-filled as in .env.example: until its MODEL and key are set, every start logs a harmless config_warning
# "LLM provider 'fallback2' skipped"
LLM_FALLBACK2_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
LLM_FALLBACK2_MODEL: ""
LLM_FALLBACK2_REASONING_EFFORT: ""
# Retrieval (RERANK stays off: TinyBERT measured -0.040 MRR@10, eval/results/retrieval-tinybert.json)
INDEX_DIR: "data/index"
EMBED_MODEL: "BAAI/bge-small-en-v1.5"
RETRIEVAL_MODE: "hybrid"
RERANK: "off"
GATE_SIGNAL: "dense"
ABSTAIN_THRESHOLD: "0.69"
SOURCE_URL_STYLE: "branch"
BLOG: "off"
# Serving
ONNX_THREADS: "1"
MAX_TOKENS: "600"
# LLM_TIMEOUT_S is also each provider attempt's first-byte bound, so with the plan's 25 s a hung primary leaves the
# fallback only about 5 s of ASK_TIMEOUT_S; 12-15 s gives the fallback a real chance (the lead's call)
LLM_TIMEOUT_S: "25"
QUEUE_WAIT_S: "20"
# The whole-/ask bound, queue wait included: QUEUE_WAIT_S 20 < ASK_TIMEOUT_S 30 < Cloud Run --timeout 60
ASK_TIMEOUT_S: "30"
MAX_CONCURRENCY: "8"
RATE_LIMIT_PER_MIN: "120"
RATE_LIMIT_BURST: "200"
DAILY_TOKEN_BUDGET: "5000000"
PUBLIC_BASE_URL: ""
# > 0 turns on the in-app index refresher; deploy.sh then adds --no-cpu-throttling on Cloud Run
REFRESH_INTERVAL_MIN: "0"
LOG_LEVEL: "INFO"
